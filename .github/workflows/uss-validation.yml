name: USS validation
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Rebuild source-derived modules
        run: node tools/build-modules.mjs
      - name: Reject stale or hand-edited generated modules
        run: git diff --exit-code -- modules/
      - name: Regenerate task indexes and reject stale or hand-edited ones
        run: |
          node tools/build-indexes.mjs
          git diff --exit-code -- MODULE-INDEX.md bundles/
      - name: Resolve and compile task bundles
        run: node tools/build-bundles.mjs
      - name: Validate source coverage and policy invariants
        run: node tools/validate.mjs
      - name: Validate the machine-readable control catalog and evidence template
        run: node tools/validate-evidence.mjs --file templates/security-evidence.example.json
      - name: Run tests
        run: node --test tests/*.test.mjs
