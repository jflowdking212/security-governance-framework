name: Consumer application security scans

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (commit range on push/PR, full history on schedule)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject unreviewed scanner configuration
        shell: bash
        run: |
          set -euo pipefail
          git -c core.fsmonitor=false rev-parse --show-toplevel >/dev/null
          for file in .gitleaks.toml .gitleaksignore gitleaks.toml gitleaks.yaml gitleaks.yml .semgrep.yml .semgrep.yaml semgrep.yml semgrep.yaml codeql-config.yml codeql-config.yaml .github/codeql/codeql-config.yml .github/codeql/codeql-config.yaml; do
            if [ -e "$file" ]; then
              printf 'Unreviewed scanner override is not permitted: %s\n' "$file" >&2
              exit 1
            fi
          done
          nested_semgrepignore="$(find . -path './.git' -prune -o -path './node_modules' -prune -o -name '.semgrepignore' -not -path './.semgrepignore' -print)"
          if [ -n "$nested_semgrepignore" ]; then
            printf 'Nested .semgrepignore is not permitted: %s\n' "$nested_semgrepignore" >&2
            exit 1
          fi
          if [ -L .semgrepignore ]; then
            printf '%s\n' 'A symlinked .semgrepignore is not permitted' >&2
            exit 1
          fi
          if [ -f .semgrepignore ]; then
            actual="$(awk 'NF && $1 !~ /^#/ { print $1 }' .semgrepignore | sort)"
            expected="$(printf '.git/\nnode_modules/\n' | sort)"
            if [ "$actual" != "$expected" ]; then
              printf '%s\n' '.semgrepignore may exclude only .git/ and node_modules/' >&2
              exit 1
            fi
          fi
          target_count=0
          while IFS= read -r -d '' file; do
            target_count=$((target_count+1))
            if git -c core.fsmonitor=false check-ignore --no-index -q -- "$file"; then
              printf 'Tracked Semgrep target is excluded by .gitignore: %s\n' "$file" >&2
              exit 1
            else
              status=$?
              if [ "$status" -ne 1 ]; then
                exit "$status"
              fi
            fi
          done < <(git -c core.fsmonitor=false ls-files -z)
          if [ "$target_count" -eq 0 ]; then
            printf '%s\n' 'No tracked files found for Semgrep scan' >&2
            exit 1
          fi
      - name: Run Semgrep
        env:
          SEMGREP_SEND_METRICS: "off"
        run: semgrep scan --config p/default --error --no-suppress-errors --metrics=off .

  codeql:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Initialise CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: 'javascript-typescript, actions'
          # For compiled languages, configure a supported manual/autobuild mode.
          build-mode: none
      - name: Analyse source
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3

  osv:
    name: OSV dependency vulnerability scan
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@d3c1414ded37de590f207572e37a7d180f1d0ef7 # reviewed 2026-11-11
    with:
      fail-on-vuln: true
      upload-sarif: true

# Optional: enable GitHub Dependency Review only after the repository dependency
# graph is enabled and the dependency-graph compare API is confirmed accessible.
